name: Update Download Stats

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: node scripts/fetch-downloads.js
        env:
          GPLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY }}
          GPLAY_STATS_BUCKET: ${{ secrets.GPLAY_STATS_BUCKET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads.json
          git diff --cached --quiet || git commit -m "chore: update download stats"
          git push
